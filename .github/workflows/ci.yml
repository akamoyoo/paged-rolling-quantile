name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.compiler }}, ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        config:
          - name: release
            cmake: -DCMAKE_BUILD_TYPE=Release
          - name: sanitizers
            cmake: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRQ_SANITIZE=ON
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DRQ_WARNINGS_AS_ERRORS=ON
          ${{ matrix.config.cmake }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
